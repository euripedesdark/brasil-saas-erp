####################################################################################################################
# WARNING: Do not store sensitive information in this file, as its contents will be included in the Qodana report. #
####################################################################################################################

version: "1.0"
linter: qodana-jvm
profile:
  name: qodana.recommended
include:
  - name: CheckDependencyLicenses

exclude:
  # Ruído de regex em massa (milhares de findings sem impacto funcional)
  - name: RegExpSimplifiable
  - name: RegExpDuplicateCharacterInClass
  - name: RegExpRedundantEscape
  - name: RegExpSingleCharAlternation
  # FP: yarn.lock fantasma 0.0.0-ANY no frontend eSocial embutido
  - name: MaliciousLibrariesLocal
    paths:
      - src/main/resources/microservices/esocial/frontend
  # Placeholders de instalacao/dev — nao sao secrets reais em producao
  - name: HardcodedPasswords
    paths:
      - install_ruby_certificados_banco.sh
      - create_modules.sh
      - test_database.sh
      - test_db_connection.sh
      - docker-compose.yml
      - src/main/resources/application-dev.yml
      # Terceiro embutido (Spring AI): workflows usam GH_TOKEN na URL do git — FP
      - src/main/resources/microservices/spring-ai
  # Metadata embutida do Spring AI (nao e a do ERP)
  - name: SpringBootAdditionalConfig
    paths:
      - src/main/resources/microservices/spring-ai
  - name: KotlinMavenPluginPhase
  # Taint XSS/SQL em massa nos controllers Spring (respostas tipadas / @PreAuthorize)
  # — o scanner marca todo RequestParam/PathVariable; ruido sem vulnerabilidade comprovada
  - name: TaintAnalysisJVM
    paths:
      - src/main/java/br/com/brasil_saas
  # CVEs do stack Spring Boot 3.5.16 (ja na ultima 3.5.x). Dependabot/GitHub
  # Security acompanha o upgrade de plataforma; o Qodana so repete o BOM.
  - name: VulnerableLibrariesLocal

failureConditions:
  severityThresholds:
    critical: 0
    high: 80
