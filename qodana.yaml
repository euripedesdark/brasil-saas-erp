####################################################################################################################
# WARNING: Do not store sensitive information in this file, as its contents will be included in the Qodana report. #
####################################################################################################################

version: "1.0"
linter: qodana-jvm
profile:
  name: qodana.recommended
include:
  - name: CheckDependencyLicenses

exclude:
  # Regex em massa (ruído sem impacto)
  - name: RegExpSimplifiable
  - name: RegExpDuplicateCharacterInClass
  - name: RegExpRedundantEscape
  - name: RegExpSingleCharAlternation
  # SLF4J: último arg Throwable é stack trace válido
  - name: LoggingPlaceholderCount
  - name: SLF4JFormat
  # Taint: marca todo RequestParam/PathVariable em controllers Spring tipados
  - name: TaintAnalysisJVM
  - name: JvmTaintAnalysis
  - name: TaintAnalysis
  # Headers customizados do ERP (X-Empresa-Id etc.)
  - name: UastIncorrectHttpHeaderInspection
  # Duplicação estrutural de controllers/CRUD legados
  - name: DuplicatedCode
  # Sugestões cosméticas Lombok em entidades JPA
  - name: LombokGetterMayBeUsed
  - name: LombokSetterMayBeUsed
  # FP em código de terceiros embutido
  - name: MaliciousLibrariesLocal
    paths:
      - src/main/resources/microservices/esocial/frontend
  - name: HardcodedPasswords
    paths:
      - install_ruby_certificados_banco.sh
      - create_modules.sh
      - test_database.sh
      - test_db_connection.sh
      - docker-compose.yml
      - src/main/resources/application-dev.yml
      - src/main/resources/microservices/spring-ai
  - name: SpringBootAdditionalConfig
    paths:
      - src/main/resources/microservices/spring-ai
  - name: KotlinMavenPluginPhase
  # CVEs do BOM Spring Boot 3.5.x — acompanhados no Dependabot
  - name: VulnerableLibrariesLocal

failureConditions:
  severityThresholds:
    critical: 0
    high: 100
    moderate: 500
