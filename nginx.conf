# Nginx configuration for Brasil SaaS ERP
#
# IMPORTANT: the ERP owns HTTP :80 only. HTTPS :443 belongs to another service.
# This file must never redirect the ERP to HTTPS or bind :443.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # Performance tuning
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/xml+rss text/javascript;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # Upstream configuration
    upstream brasil_saas_backend {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    upstream brasil_saas_staging {
        server 127.0.0.1:18081;
        keepalive 32;
    }

    # Select the environment by hostname. Staging must never fall back to
    # production, even when its backend is stopped (return 502 instead).
    map $host $erp_upstream {
        default brasil_saas_backend;
        staging.brasil-saaserp.com brasil_saas_staging;
    }

    # ERP entry point: HTTP :80 -> Spring Boot/Tomcat :8080.
    # There is intentionally NO HTTP->HTTPS redirect here.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name brasil-saaserp.com staging.brasil-saaserp.com _;

        location / {
            proxy_pass http://$erp_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
            proxy_read_timeout 300s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
        }
    }

}
