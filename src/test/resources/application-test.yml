spring:
  datasource:
    url: "jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS brasil_saas"
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    # Depois do DDL do Hibernate: o create-drop derruba todas as tabelas
    # mapeadas antes de recriar, entao um script anterior seria apagado no
    # mesmo boot — e e' justamente o create que falha em bpchar/float8[].
    defer-datasource-initialization: true
    properties:
      hibernate:
        default_schema: brasil_saas

  flyway:
    enabled: false

  # Tabelas que o H2 nao sabe criar sozinho. O Hibernate gera DDL do
  # columnDefinition da entidade, e 11 colunas usam bpchar(n) (tipo interno do
  # Postgres), que o H2 responde "Unknown data type: BPCHAR"; bc_ia_embedding
  # usa float8[], que tambem nao passa. Enquanto isso o schema de
  # brasil_saas_dl nem existe aqui e mais 9 create table caem.
  sql:
    init:
      mode: always
      schema-locations: classpath:h2-tabelas-legadas.sql

  # Mail dummy para o perfil de teste (JavaMailSender é obrigatório em RelatorioAgendadoServiceImpl)
  mail:
    host: localhost
    port: 25
    properties:
      mail:
        smtp:
          connectiontimeout: 1000
          timeout: 1000
          writetimeout: 1000

  data:
    mongodb:
      auto-index-creation: false

  # Desabilita OpenAI no teste para evitar chamadas externas sem API key
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding: none
      image: none
    openai:
      api-key: ${OPENAI_API_KEY:test-key-not-for-production}
      chat:
        enabled: false
      image:
        enabled: false
      embedding:
        enabled: false

logging:
  level:
    root: WARN
    br.com.brasil_saas: INFO

# Monitor de imagens Mongo: desligado nos testes (sem Mongo autenticado)
brasil-saas:
  imagens:
    monitoramento-enabled: false
