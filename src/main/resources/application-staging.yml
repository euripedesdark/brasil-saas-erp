# Staging isolado: nao apontar para banco, bucket, IAM/AD ou URL publica de producao.
server:
  port: ${SERVER_PORT:18081}
  error:
    include-message: never
    include-binding-errors: never

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 1
  datasource:
    url: "${DB_URL}?currentSchema=brasil_saas"
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: BrasilSaasStagingPool
      maximum-pool-size: ${DB_POOL_MAX:3}
      minimum-idle: ${DB_POOL_MIN:1}
      connection-timeout: 15000
  rabbitmq:
    host: ${RABBIT_HOST:127.0.0.1}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER}
    password: ${RABBIT_PASSWORD}
    virtual-host: ${RABBIT_VHOST:/staging}
  flyway:
    enabled: false

logging:
  level:
    root: INFO
    br.com.brasil_saas: INFO
    org.hibernate.SQL: WARN

app:
  minio:
    url: ${MINIO_URL}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:brasil-saas-staging}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}
  ia:
    provider: ${IA_PROVIDER:openai}
    api-key: ${OPENAI_API_KEY:}
    model: ${IA_MODEL:gpt-4o-mini}
    embedding-model: ${IA_EMBEDDING_MODEL:text-embedding-3-small}

brasil-saas:
  auth-service:
    enabled: ${BRASIL_SAAS_AUTH_SERVICE_ENABLED:false}
    base-url: ${BRASIL_SAAS_AUTH_SERVICE_URL:http://127.0.0.1:8181}
  ad:
    enabled: ${BRASIL_SAAS_AD_ENABLED:false}

stripe:
  success-url: ${STRIPE_SUCCESS_URL:http://localhost:18081/financeiro/stripe/sucesso?session_id={CHECKOUT_SESSION_ID}}
  cancel-url: ${STRIPE_CANCEL_URL:http://localhost:18081/financeiro/stripe/cancelado}
