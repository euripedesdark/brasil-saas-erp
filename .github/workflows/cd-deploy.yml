name: CI - Self-hosted ERP build

on:
  push:
    branches:
      - main
      - staging
      - fix/self-hosted-runner-ci
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build React frontend and Spring Boot JAR
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/main/resources/static/react/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/main/resources/static/react
        run: npm ci

      - name: Build frontend
        working-directory: src/main/resources/static/react
        run: npm run build

      - name: Package Spring Boot application
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Validate packaged JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="target/brasil-saas-erp-1.0.0-SNAPSHOT.jar"
          test -s "$JAR"
          jar tf "$JAR" | grep -q '^BOOT-INF/'
          sha256sum "$JAR"

      - name: Request deployment through the dedicated deploy account
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -Eeuo pipefail
          STAGING="/opt/brasil-saas-erp-deploy"
          NEW_JAR="$GITHUB_WORKSPACE/target/brasil-saas-erp-1.0.0-SNAPSHOT.jar"
          HEALTH_URL="http://127.0.0.1:8080/actuator/health"

          test -s "$NEW_JAR"
          jar tf "$NEW_JAR" | grep -q '^BOOT-INF/'
          test -d "$STAGING" || { echo "::error::Pasta de staging ausente: $STAGING"; exit 1; }
          test -w "$STAGING" || { echo "::error::O runner não tem permissão de escrita em $STAGING. Configure a ACL para euripedes."; exit 1; }

          # O runner não usa sudo. O systemd.path detecta o marcador e aciona
          # o serviço de deploy, executado como erp-deploy.
          install -m 0640 "$NEW_JAR" "$STAGING/release.jar"
          setfacl -m u:erp-deploy:r-- "$STAGING/release.jar"
          printf '%s\n' "$GITHUB_SHA" > "$STAGING/deploy.trigger"

          echo "Solicitação de deploy enviada ao serviço dedicado."
          DEPLOYED=false
          for _ in $(seq 1 60); do
            if [ -r "$STAGING/deploy.status" ] && [ "$(cat "$STAGING/deploy.status")" = "$GITHUB_SHA" ]; then
              DEPLOYED=true
              break
            fi
            sleep 5
          done

          if [ "$DEPLOYED" != true ]; then
            echo "::error::O serviço dedicado não confirmou o deploy do commit $GITHUB_SHA em até 5 minutos."
            exit 1
          fi

          curl --fail --silent --show-error --max-time 5 "$HEALTH_URL" -o /tmp/brasil-saas-erp-health.json
          python3 -c 'import json; assert json.load(open("/tmp/brasil-saas-erp-health.json")).get("status") == "UP"'
          echo "Deploy do commit $GITHUB_SHA confirmado; health check OK."
