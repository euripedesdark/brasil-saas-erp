name: Diagnose ERP public routes
on:
  push:
    branches: [fix/staging-host-routing]
    paths: [.github/workflows/diagnose-public-routes.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect services, routes and DNS without credentials
        shell: bash
        run: |
          set -u
          for svc in nginx cloudflared cloudflared-tunel brasil-saas-erp-staging brasil_saas-erp brasil-saas-erp; do
            echo "$svc: $(systemctl is-active "$svc" 2>/dev/null || true)"
          done
          for port in 80 8080 8081; do
            curl -sS --max-time 5 -o /dev/null -w "PORT=$port HTTP=%{http_code}\n" "http://127.0.0.1:$port/login" || true
          done
          for host in brasil-saaserp.com staging.brasil-saaserp.com; do
            echo "HOST=$host"
            getent ahostsv4 "$host" || true
            curl -sS --max-time 10 -o /dev/null -w "PUBLIC_HTTP=%{http_code}\n" "https://$host/login" || true
            curl -sS --max-time 5 -H "Host: $host" -o /dev/null -w "NGINX_HTTP=%{http_code}\n" http://127.0.0.1/login || true
            if command -v dig >/dev/null; then dig +time=2 +tries=1 +noall +comments +answer +authority @1.1.1.1 "$host" A; fi
          done
          curl -sS --max-time 15 -o /tmp/erp-domain-rdap.json -w "RDAP_HTTP=%{http_code}\n" https://rdap.verisign.com/com/v1/domain/brasil-saaserp.com || true
          python3 - <<'PY'
          import json, os, pathlib
          try:
              d=json.load(open('/tmp/erp-domain-rdap.json'))
              print('RDAP',d.get('ldhName'),d.get('errorCode'),d.get('title'))
          except Exception: print('RDAP unavailable')
          for f in ['/etc/nginx/nginx.conf','/etc/cloudflared/config.yml','/etc/brasil-saas/staging.env','/opt/brasil-saas-erp/staging/app.jar']:
              p=pathlib.Path(f)
              print(f,'exists=',p.exists(),'readable=',os.access(f,os.R_OK),'writable=',os.access(f,os.W_OK))
          roots=[pathlib.Path('/etc/nginx')]
          for root in roots:
              for p in root.rglob('*'):
                  if p.is_file() and (p.suffix=='.conf' or p.parent.name=='sites-enabled'):
                      try:
                          for line in p.read_text().splitlines():
                              if line.strip().startswith(('listen ','server_name ','proxy_pass ','server 127.0.0.1:')):
                                  print(str(p),line.strip())
                      except OSError: pass
          PY
  validate-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Nginx in disposable test runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx
          sudo useradd --system --no-create-home nginx || true
      - name: Validate syntax and environment routing
        shell: bash
        run: |
          sudo nginx -t -c "$GITHUB_WORKSPACE/nginx.conf"
          python3 - <<'PY'
          import http.server, threading, tempfile, pathlib, subprocess, urllib.request, urllib.error, json, time
          class Backend(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  body=json.dumps(dict(port=self.server.server_port,path=self.path,auth=self.headers.get('Authorization'),tenant=self.headers.get('X-Empresa-Id'))).encode()
                  self.send_response(200); self.send_header('Content-Length',str(len(body))); self.end_headers(); self.wfile.write(body)
              def log_message(self,*args): pass
          servers=[]
          for port in (8080,8081):
              server=http.server.ThreadingHTTPServer(('127.0.0.1',port),Backend)
              threading.Thread(target=server.serve_forever,daemon=True).start()
              servers.append(server)
          with tempfile.TemporaryDirectory() as tmp:
              config=pathlib.Path('nginx.conf').read_text().replace('user  nginx;','').replace('listen 80 default_server;','listen 18080 default_server;').replace('listen [::]:80 default_server;','listen [::]:18080 default_server;').replace('/var/log/nginx/error.log',tmp+'/error.log').replace('/var/log/nginx/access.log',tmp+'/access.log').replace('/var/run/nginx.pid',tmp+'/nginx.pid')
              path=pathlib.Path(tmp)/'nginx.conf'; path.write_text(config)
              proc=subprocess.Popen(['nginx','-c',str(path),'-g','daemon off;'])
              def request(host):
                  req=urllib.request.Request('http://127.0.0.1:18080/api/example?x=1',headers={'Host':host,'Authorization':'Bearer synthetic-test','X-Empresa-Id':'123'})
                  with urllib.request.urlopen(req,timeout=5) as response: return json.load(response)
              try:
                  for _ in range(30):
                      try: request('localhost'); break
                      except OSError: time.sleep(.1)
                  for host,port in [('brasil-saaserp.com',8080),('staging.brasil-saaserp.com',8081),('localhost',8080)]:
                      got=request(host)
                      assert got==dict(port=port,path='/api/example?x=1',auth='Bearer synthetic-test',tenant='123'),got
                      print(host,'OK',got)
                  servers[1].shutdown(); servers[1].server_close()
                  try: request('staging.brasil-saaserp.com'); raise AssertionError('Staging fell back to production')
                  except urllib.error.HTTPError as exc: assert exc.code==502,exc.code
                  assert request('brasil-saaserp.com')['port']==8080
                  print('Staging unavailable: 502; production remains reachable')
              finally:
                  proc.terminate(); proc.wait(timeout=5)
                  for server in servers: server.shutdown(); server.server_close()
          PY
