name: Validate local Graylog setup script
on:
  push:
    branches: [main, feat/graylog-local-setup]
    paths: ['scripts/bi/**', '.github/workflows/validate-graylog-local-setup.yml']
  pull_request:
    paths: ['scripts/bi/**', '.github/workflows/validate-graylog-local-setup.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test discovery, authentication and repeatable configuration
        run: python3 scripts/bi/test-configure-graylog.py
