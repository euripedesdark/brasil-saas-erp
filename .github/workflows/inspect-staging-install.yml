name: Inspect isolated staging installation
on:
  push:
    branches: [ops/install-isolated-staging]
    paths: [.github/workflows/inspect-staging-install.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 4
    steps:
      - name: Inspect available isolation and proxy permissions
        shell: bash
        run: |
          set -u
          echo '### Runtime tools'
          for tool in java psql initdb pg_ctl postgres podman docker nginx; do command -v "$tool" || true; done
          echo '### User service manager'
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user is-active default.target || true
          loginctl show-user "$(id -un)" -p Linger || true
          echo '### Resources'
          free -m
          df -h "$HOME"
          echo '### Container runtime access'
          if command -v podman >/dev/null; then podman info --format '{{.Host.Security.Rootless}}' 2>/dev/null || true; fi
          if command -v docker >/dev/null; then docker info --format '{{.ServerVersion}}' 2>/dev/null || true; fi
          echo '### Paths (no credential contents)'
          python3 - <<'PY'
          import os,pathlib
          for f in ['/etc/nginx','/etc/nginx/conf.d','/etc/nginx/default.d','/etc/nginx/nginx.conf','/opt/brasil-saas-erp','/opt/brasil-saas-erp-deploy','/usr/pgsql-18/bin','/usr/pgsql-17/bin','/usr/lib/postgresql']:
              print(f,'exists=',os.path.exists(f),'read=',os.access(f,os.R_OK),'write=',os.access(f,os.W_OK))
          for root in ['/opt/brasil-saas-erp','/opt/brasil-saas-erp-deploy']:
              try:
                  for p in pathlib.Path(root).glob('*.jar'): print('JAR',p,'bytes=',p.stat().st_size,'read=',os.access(p,os.R_OK))
              except OSError: pass
          for root in ['/usr/lib/postgresql','/usr/pgsql-18/bin','/usr/pgsql-17/bin']:
              try:
                  for p in pathlib.Path(root).rglob('initdb'): print('INITDB',p)
              except OSError: pass
          PY
          echo '### PostgreSQL current user privileges (no application data)'
          if command -v psql >/dev/null; then
            PGCONNECT_TIMEOUT=5 psql -X -d postgres -Atc 'select current_user, rolcreatedb, rolsuper from pg_roles where rolname=current_user' 2>/dev/null || true
          fi
          echo '### Dedicated staging port'
          ss -ltn '( sport = :18081 or sport = :15432 or sport = :16379 or sport = :27018 or sport = :15673 )'
