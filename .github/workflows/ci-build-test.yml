name: CI - Build and Test

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/ci-build-test.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/ci-build-test.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: brasil-saas
          POSTGRES_PASSWORD: test123
          POSTGRES_DB: brasil-saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand({ ping: 1 }).ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/main/resources/static/react/package-lock.json

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache Node.js dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            src/main/resources/static/react/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Node.js dependencies
        run: |
          cd $GITHUB_WORKSPACE/src/main/resources/static/react
          npm ci
          cd $GITHUB_WORKSPACE

      - name: Validate four frontend languages
        run: |
          cd $GITHUB_WORKSPACE/src/main/resources/static/react
          npm run test:i18n

      - name: Build frontend
        run: |
          cd $GITHUB_WORKSPACE/src/main/resources/static/react
          npm run build
          cd $GITHUB_WORKSPACE

      - name: Initialize test database schema
        env:
          PGPASSWORD: test123
        run: |
          set -euo pipefail
          psql -h localhost -U brasil-saas -d brasil-saas -v ON_ERROR_STOP=1 \
            -c "CREATE SCHEMA IF NOT EXISTS brasil_saas;"

      - name: Build backend with Maven
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/brasil-saas?currentSchema=brasil_saas
          SPRING_DATASOURCE_USERNAME: brasil-saas
          SPRING_DATASOURCE_PASSWORD: test123
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/brasil-saas
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
        run: mvn clean compile -DskipTests

      - name: Create application schema
        env:
          PGPASSWORD: test123
        run: |
          psql -h localhost -U brasil-saas -d brasil-saas -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS brasil_saas;"

      - name: Run unit tests
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/brasil-saas
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
        run: mvn test

      - name: Generate test report
        if: always()
        run: |
          mkdir -p test-reports
          find . -name "TEST-*.xml" -exec cp {} test-reports/ \;

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-reports/
          retention-days: 30

      - name: Package application
        run: mvn clean package -DskipTests

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: brasil-saas-erp-jar
          path: target/*.jar
          retention-days: 7

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Run SpotBugs
        continue-on-error: true
        run: mvn spotbugs:check

      - name: Run PMD
        continue-on-error: true
        run: mvn pmd:check

      - name: Run Checkstyle
        run: mvn checkstyle:check || true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run OWASP Dependency Check
        continue-on-error: true
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'BrasilSaaS'
          path: '.'
          format: 'ALL'
          args: >-
            --failOnCVSS 7
            --enableExperimental

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: reports/
          if-no-files-found: warn
          retention-days: 30
