name: Inspect installed Graylog for BI integration
on:
  push:
    branches: [feat/bi-four-domains]
    paths: [.github/workflows/inspect-graylog-bi.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 3
    steps:
      - name: Read version and local HTTP availability without credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, urllib.request, urllib.error
          def run(args):
              try:
                  result = subprocess.run(args, capture_output=True, text=True, timeout=15)
                  print(' '.join(args), 'exit=', result.returncode)
                  print(result.stdout[:2000])
              except (OSError, subprocess.TimeoutExpired):
                  print(args[0], 'unavailable')
          run(['systemctl', 'show', 'graylog-server', '-p', 'ActiveState', '-p', 'SubState'])
          run(['rpm', '-q', 'graylog-server', 'graylog-datanode', 'opensearch'])
          run(['dpkg-query', '-W', '-f=${Package} ${Version}\n', 'graylog-server', 'graylog-datanode', 'opensearch'])
          for filename in ['/etc/graylog/server/server.conf', '/etc/graylog-server/server.conf']:
              try:
                  for line in pathlib.Path(filename).read_text().splitlines():
                      if line.strip().startswith('#') or '=' not in line: continue
                      key, value = line.split('=', 1)
                      if key.strip() in {'http_bind_address', 'http_external_uri'}:
                          # Configuration may contain embedded credentials: omit such values.
                          if '@' not in value and '?' not in value:
                              print(key.strip(), '=', value.strip())
              except (PermissionError, FileNotFoundError):
                  print(filename, 'not readable')
          for path in ['/api/', '/api/system/lbstatus']:
              request = urllib.request.Request('http://127.0.0.1:9000' + path, headers={'Accept':'application/json'})
              try:
                  response = urllib.request.urlopen(request, timeout=5)
              except urllib.error.HTTPError as error:
                  response = error
              except (urllib.error.URLError, TimeoutError):
                  print(path, 'local HTTP unavailable'); continue
              print(path, 'HTTP', response.code)
              for header in ['X-Graylog-Server-Version', 'X-Graylog-Node-ID']:
                  if header in response.headers: print(header, response.headers[header])
              response.close()
          PY
