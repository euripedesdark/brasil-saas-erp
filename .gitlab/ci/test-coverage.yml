# Espelho: .github/workflows/test-coverage.yml
variables:
  MIN_COVERAGE: "70"

coverage:
  stage: quality
  image: maven:3.9-eclipse-temurin-21
  allow_failure: true
  services:
    - name: postgres:18
      alias: postgres
      variables:
        POSTGRES_USER: brasil-saas
        POSTGRES_PASSWORD: test123
        POSTGRES_DB: brasil-saas
  variables:
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/brasil-saas?currentSchema=brasil_saas
    SPRING_DATASOURCE_USERNAME: brasil-saas
    SPRING_DATASOURCE_PASSWORD: test123
  cache:
    key: maven-$CI_COMMIT_REF_SLUG
    paths:
      - .m2/repository
  script:
    - PGPASSWORD=test123 psql -h postgres -U brasil-saas -d brasil-saas -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS brasil_saas;"
    - mvn -B -ntp -Dmaven.repo.local=.m2/repository clean test jacoco:report || true
    - |
      REPORT="target/site/jacoco/jacoco.csv"
      test -f "$REPORT" || { echo "JaCoCo CSV nao encontrado"; exit 1; }
      read -r MISSED COVERED < <(awk -F',' 'NR>1 {m+=$7; c+=$8} END {print m, c}' "$REPORT")
      TOTAL=$((MISSED + COVERED))
      if [ "$TOTAL" -eq 0 ]; then COVERAGE=0; else COVERAGE=$(( COVERED * 100 / TOTAL )); fi
      echo "Cobertura de linhas: ${COVERAGE}%"
      if [ "$COVERAGE" -lt "${MIN_COVERAGE}" ]; then
        echo "Cobertura ${COVERAGE}% abaixo do minimo ${MIN_COVERAGE}%"; exit 1
      fi
  artifacts:
    when: always
    paths:
      - target/site/jacoco/
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
      changes:
        paths:
          - 'src/**'
          - 'pom.xml'
