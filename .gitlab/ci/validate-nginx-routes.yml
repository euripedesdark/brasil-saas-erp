# Espelho automatico: .github/workflows/validate-nginx-routes.yml
validate-nginx-routes--validate-proxy:
  stage: inspect
  image: alpine:latest
  allow_failure: true
  script:
  - 'sudo apt-get update -qq

    sudo apt-get install -y nginx

    sudo useradd --system --no-create-home nginx || true

    '
  - "sudo nginx -t -c \"$GITHUB_WORKSPACE/nginx.conf\"\npython3 - <<'PY'\nimport http.server,\
    \ threading, tempfile, pathlib, subprocess, urllib.request, urllib.error, json,\
    \ time\nclass Backend(http.server.BaseHTTPRequestHandler):\n    def do_GET(self):\n\
    \        body=json.dumps(dict(port=self.server.server_port,path=self.path,auth=self.headers.get('Authorization'),tenant=self.headers.get('X-Empresa-Id'))).encode()\n\
    \        self.send_response(200); self.send_header('Content-Length',str(len(body)));\
    \ self.end_headers(); self.wfile.write(body)\n    def log_message(self,*args):\
    \ pass\nservers=[]\nfor port in (8080,18081):\n    server=http.server.ThreadingHTTPServer(('127.0.0.1',port),Backend)\n\
    \    threading.Thread(target=server.serve_forever,daemon=True).start()\n    servers.append(server)\n\
    with tempfile.TemporaryDirectory() as tmp:\n    config=pathlib.Path('nginx.conf').read_text().replace('user\
    \  nginx;','').replace('listen 80 default_server;','listen 18080 default_server;').replace('listen\
    \ [::]:80 default_server;','listen [::]:18080 default_server;').replace('/var/log/nginx/error.log',tmp+'/error.log').replace('/var/log/nginx/access.log',tmp+'/access.log').replace('/var/run/nginx.pid',tmp+'/nginx.pid')\n\
    \    path=pathlib.Path(tmp)/'nginx.conf'; path.write_text(config)\n    proc=subprocess.Popen(['nginx','-c',str(path),'-g','daemon\
    \ off;'])\n    def request(host):\n        req=urllib.request.Request('http://127.0.0.1:18080/api/example?x=1',headers={'Host':host,'Authorization':'Bearer\
    \ synthetic-test','X-Empresa-Id':'123'})\n        with urllib.request.urlopen(req,timeout=5)\
    \ as response: return json.load(response)\n    try:\n        for _ in range(30):\n\
    \            try: request('localhost'); break\n            except OSError: time.sleep(.1)\n\
    \        for host,port in [('brasil-saaserp.com',8080),('staging.brasil-saaserp.com',18081),('localhost',8080)]:\n\
    \            got=request(host)\n            assert got==dict(port=port,path='/api/example?x=1',auth='Bearer\
    \ synthetic-test',tenant='123'),got\n            print(host,'OK',got)\n      \
    \  servers[1].shutdown(); servers[1].server_close()\n        try: request('staging.brasil-saaserp.com');\
    \ raise AssertionError('Staging fell back to production')\n        except urllib.error.HTTPError\
    \ as exc: assert exc.code==502,exc.code\n        assert request('brasil-saaserp.com')['port']==8080\n\
    \        print('Staging unavailable: 502; production remains reachable')\n   \
    \ finally:\n        proc.terminate(); proc.wait(timeout=5)\n        for server\
    \ in servers: server.shutdown(); server.server_close()\nPY\n"
  rules:
  - if: $CI_PIPELINE_SOURCE == "web"
