# Espelho: .github/workflows/qodana_code_quality.yml
qodana:
  stage: quality
  image: jetbrains/qodana-jvm-community:2026.1
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - |
      if [ -z "${QODANA_TOKEN:-}" ]; then echo "QODANA_TOKEN ausente; pulando."; exit 0; fi
      curl -fsSL https://qodana.cloud/cli.sh -o /tmp/qodana && bash /tmp/qodana scan --token "$QODANA_TOKEN" || true
