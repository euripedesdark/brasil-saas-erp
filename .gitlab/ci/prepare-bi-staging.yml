# Espelho automatico: .github/workflows/prepare-bi-staging.yml
prepare-bi-staging--prepare:
  stage: inspect
  image: maven:3.9-eclipse-temurin-25
  allow_failure: true
  script:
  - "python3 - <<'PY'\nimport pathlib, os, shutil, importlib.util, subprocess, pwd,\
    \ shlex\nroot = pathlib.Path.home() / '.local/share/brasil-saas-bi-ready'\nscripts\
    \ = root / 'scripts/bi'\ntarget = root / 'integrations/graylog-bi/target'\nfor\
    \ path in [root, scripts, target]: path.mkdir(parents=True, exist_ok=True); path.chmod(0o700)\n\
    for name in ['install-graylog-bi.py', 'configure-graylog.py', 'validate-staging-bi.py']:\n\
    \    path = scripts / name\n    if path.is_symlink(): raise RuntimeError('Installer\
    \ destination cannot be a symlink')\n    shutil.copyfile(pathlib.Path('scripts/bi')\
    \ / name, path); path.chmod(0o700)\nsource = pathlib.Path(os.environ['PLUGIN_SOURCE'])\
    \ / 'brasil-saas-graylog-bi-1.0.0.jar'\nspec = importlib.util.spec_from_file_location('installer',\
    \ scripts / 'install-graylog-bi.py')\ninstaller = importlib.util.module_from_spec(spec);\
    \ spec.loader.exec_module(installer)\ndigest = installer.validate_jar(source)\n\
    destination = target / source.name\nif destination.is_symlink(): raise RuntimeError('Plugin\
    \ destination cannot be a symlink')\nshutil.copyfile(source, destination); destination.chmod(0o600)\n\
    launcher = root / 'activate-bi.sh'\nif launcher.is_symlink(): raise RuntimeError('Launcher\
    \ destination cannot be a symlink')\nuser = shlex.quote(pwd.getpwuid(os.getuid()).pw_name)\n\
    runtime = '/run/user/' + str(os.getuid())\nuser_command = 'runuser -u ' + user\
    \ + ' -- env XDG_RUNTIME_DIR=' + runtime + ' DBUS_SESSION_BUS_ADDRESS=unix:path='\
    \ + runtime + '/bus '\nlauncher.write_text('#!/usr/bin/env bash\\nset -Eeuo pipefail\\\
    n'\n    + 'test \"$(id -u)\" = 0 || { echo \"Execute com sudo bash.\"; exit 1;\
    \ }\\n'\n    + 'python3 \"' + str(scripts / 'install-graylog-bi.py') + '\" --web-url\
    \ http://192.168.2.10:9002/ --apply --restart\\n'\n    + 'python3 \"' + str(scripts\
    \ / 'configure-graylog.py') + '\" --web-url http://192.168.2.10:9002/ --apply\
    \ --login\\n'\n    + user_command + 'systemctl --user restart brasil-saas-staging-app.service\\\
    n'\n    + 'echo \"Conexao salva. O staging foi reiniciado para ler a configuracao;\
    \ valide apos inicializar.\"\\n')\nlauncher.chmod(0o700)\nsubprocess.run(['bash',\
    \ '-n', str(launcher)], check=True)\nprint('VALIDATED_PLUGIN_SHA256', digest)\n\
    print('LOCAL_INSTALL_COMMAND: sudo bash', launcher)\nprint('Package prepared.\
    \ No service restarted or system configuration changed.')\nPY\n"
  - "python3 - <<'PY'\nimport pathlib, os, subprocess, json\nos.environ['XDG_RUNTIME_DIR']\
    \ = '/run/user/' + str(os.getuid())\nos.environ['DBUS_SESSION_BUS_ADDRESS'] =\
    \ 'unix:path=' + os.environ['XDG_RUNTIME_DIR'] + '/bus'\ndef state(unit, user=False):\n\
    \    args = ['systemctl'] + (['--user'] if user else []) + ['show', unit, '-p',\
    \ 'ActiveState', '-p', 'SubState', '-p', 'ExecMainStatus']\n    result = subprocess.run(args,\
    \ capture_output=True, text=True, timeout=10)\n    print(unit, result.stdout.strip())\n\
    state('brasil-saas-staging-app.service', True)\nstate('graylog-server.service')\n\
    units = subprocess.run(['systemctl', 'list-unit-files', '--no-legend', '--no-pager'],\
    \ capture_output=True, text=True, timeout=10).stdout\nfor line in units.splitlines():\n\
    \    name = line.split()[0]\n    if 'deploy' in name and ('brasil' in name or\
    \ 'erp' in name) and name.endswith(('.service', '.path')): state(name)\nmarker\
    \ = pathlib.Path('/opt/brasil-saas-erp-deploy/deploy.status')\ntry: confirmed\
    \ = marker.read_text().strip() == '5993889899cda16498960743df679e077052d423'\n\
    except OSError: confirmed = False\nprint('MAIN_DEPLOY_MARKER_CONFIRMED', confirmed)\n\
    PY\n"
  - python3 scripts/bi/update-staging-bi.py
  - python3 scripts/bi/validate-staging-bi.py
  rules:
  - if: $CI_PIPELINE_SOURCE == "web"
  tags:
  - self-hosted
  - linux
  - x64
