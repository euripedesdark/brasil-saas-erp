# Espelho automatico: .github/workflows/inspect-graylog-bi.yml
inspect-graylog-bi--inspect:
  stage: inspect
  image: alpine:latest
  allow_failure: true
  script:
  - "python3 - <<'PY'\nimport pathlib, subprocess, urllib.request, urllib.error\n\
    def run(args):\n    try:\n        result = subprocess.run(args, capture_output=True,\
    \ text=True, timeout=15)\n        print(' '.join(args), 'exit=', result.returncode)\n\
    \        print(result.stdout[:2000])\n    except (OSError, subprocess.TimeoutExpired):\n\
    \        print(args[0], 'unavailable')\nrun(['systemctl', 'show', 'graylog-server',\
    \ '-p', 'ActiveState', '-p', 'SubState'])\nrun(['rpm', '-q', 'graylog-server',\
    \ 'graylog-datanode', 'opensearch'])\nrun(['dpkg-query', '-W', '-f=${Package}\
    \ ${Version}\\n', 'graylog-server', 'graylog-datanode', 'opensearch'])\nfor filename\
    \ in ['/etc/graylog/server/server.conf', '/etc/graylog-server/server.conf']:\n\
    \    try:\n        for line in pathlib.Path(filename).read_text(encoding='latin-1').splitlines():\n\
    \            if line.strip().startswith('#') or '=' not in line: continue\n  \
    \          key, value = line.split('=', 1)\n            if key.strip() in {'http_bind_address',\
    \ 'http_external_uri'}:\n                # Configuration may contain embedded\
    \ credentials: omit such values.\n                if '@' not in value and '?'\
    \ not in value:\n                    print(key.strip(), '=', value.strip())\n\
    \    except (PermissionError, FileNotFoundError):\n        print(filename, 'not\
    \ readable')\nfor path in ['/api/', '/api/system/lbstatus']:\n    request = urllib.request.Request('http://127.0.0.1:9002'\
    \ + path, headers={'Accept':'application/json'})\n    try:\n        response =\
    \ urllib.request.build_opener(urllib.request.ProxyHandler({})).open(request, timeout=5)\n\
    \    except urllib.error.HTTPError as error:\n        response = error\n    except\
    \ (urllib.error.URLError, TimeoutError):\n        print(path, 'local HTTP unavailable');\
    \ continue\n    print(path, 'HTTP', response.code)\n    for header in ['X-Graylog-Server-Version',\
    \ 'X-Graylog-Node-ID']:\n        if header in response.headers: print(header,\
    \ response.headers[header])\n    response.close()\nPY\n"
  rules:
  - if: $CI_PIPELINE_SOURCE == "web"
  tags:
  - self-hosted
  - linux
  - x64
