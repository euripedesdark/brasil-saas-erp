# ==========================================================================
# Brasil SaaS ERP - GitLab CI/CD
# --------------------------------------------------------------------------
# Este e o ponto de entrada do pipeline no GitLab e espelha o que existe em
# .github/workflows/* no GitHub. Ele NAO define trabalhos: apenas organiza o
# pipeline e inclui um arquivo por workflow do GitHub, para as duas
# plataformas terem o mesmo comportamento.
# ==========================================================================

# interruptible: ao empurrar um novo commit no mesmo ramo, o GitLab cancela
# o pipeline anterior ainda em execucao (evita dois pipelines competindo).
default:
  interruptible: true

# workflow.rules: define QUANDO o pipeline roda. Disparo por API (source
# "api") fica de fora de proposito, para evitar pipelines acidentais.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop")'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'        # botao "Run pipeline" na interface
    - if: '$CI_PIPELINE_SOURCE == "schedule"'   # pipeline agendado

# Ordem das etapas: um trabalho so comeca quando a etapa anterior termina,
# exceto quando usa "needs" (DAG). A etapa "deploy" so roda na main
# (ver .gitlab/ci/cd-deploy.yml).
stages:
  - build
  - test
  - quality
  - package
  - database
  - deploy
  - inspect

# Variaveis globais usadas pelos trabalhos incluidos abaixo.
variables:
  JAVA_VERSION: "25"   # o pom.xml exige release 25; nao baixar sem revisar o pom
  NODE_VERSION: "22"
  MAVEN_OPTS: "-Xmx2048m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75"

# Um arquivo incluido por workflow do GitHub. A ordem aqui nao importa:
# a sequencia real de execucao vem dos "stages" e dos "needs".
include:
  - local: '.gitlab/ci/build.yml'
  - local: '.gitlab/ci/cd-deploy.yml'
  - local: '.gitlab/ci/ci-build-test.yml'
  - local: '.gitlab/ci/ci-cd.yml'
  - local: '.gitlab/ci/ci-code-quality.yml'
  - local: '.gitlab/ci/ci-database.yml'
  - local: '.gitlab/ci/ci-dump-sanitizado.yml'
  - local: '.gitlab/ci/free-public-access.yml'
  - local: '.gitlab/ci/incident-readonly-health.yml'
  - local: '.gitlab/ci/inspect-bridge-startup.yml'
  - local: '.gitlab/ci/inspect-microservice-runtime.yml'
  - local: '.gitlab/ci/inspect-staging-install.yml'
  - local: '.gitlab/ci/install-staging-runtime.yml'
  - local: '.gitlab/ci/microservices-validation.yml'
  - local: '.gitlab/ci/openrouter-ci-auto-repair.yml'
  - local: '.gitlab/ci/openrouter-issue-agent.yml'
  - local: '.gitlab/ci/openrouter-review.yml'
  - local: '.gitlab/ci/prepare-bi-staging.yml'
  - local: '.gitlab/ci/prepare-staging-db.yml'
  - local: '.gitlab/ci/prepare-staging-proxy.yml'
  - local: '.gitlab/ci/publish-staging.yml'
  - local: '.gitlab/ci/qodana_code_quality.yml'
  - local: '.gitlab/ci/temporary-public-domain-probe.yml'
  - local: '.gitlab/ci/test-coverage.yml'
  - local: '.gitlab/ci/validate-bi-staging-checker.yml'
  - local: '.gitlab/ci/validate-nginx-routes.yml'
  - local: '.gitlab/ci/validate-openrouter-agent.yml'
  - local: '.gitlab/ci/validate-openrouter-ci-repair.yml'
